server {
    listen 10000 default_server;
    server_name _;

    root /var/www/frontend;
    index index.html;

    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript;

    # Frontend assets
    location /assets/ {
        root /var/www/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Backend Vite assets (for Admin panel)
    location /build/ {
        root /var/www/backend/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Backend static images (for Admin panel / logos)
    location /images/ {
        root /var/www/backend/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Uploaded storage files
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        try_files $uri =404;
    }

    # API and Admin routes passed to Laravel
    location ~ ^/(api|admin|sanctum) {
        root /var/www/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_read_timeout 300;
        }
    }

    # Direct PHP requests
    location ~ \.php$ {
        root /var/www/backend/public;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Client-side SPA routing (all remaining routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

